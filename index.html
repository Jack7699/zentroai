<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#09090f">
  <title>ZentroAI — Your AI Assistant</title>
  <link rel="stylesheet" href="style.css">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
</head>
<body>

  <div class="app">

    <aside class="sidebar" id="sidebar">
      <div class="brand">
        <div class="brand-icon">Z</div>
        <span>Zentro<span class="brand-ai">AI</span></span>
        <button class="close-sidebar" id="closeSidebar">×</button>
      </div>

      <button class="new-chat" id="newChat">
        <span>＋</span> New chat
        <span class="shortcut">⌘ K</span>
      </button>

      <div class="history-heading">YOUR CHATS</div>
      <div class="chat-history" id="chatHistory"></div>

      <div class="sidebar-bottom">
        <div class="profile">
          <div class="avatar">Z</div>
          <div class="profile-info">
            <strong>ZentroAI</strong>
            <span>Personal assistant</span>
          </div>
          <span class="online-dot"></span>
        </div>
      </div>
    </aside>

    <main class="main">

      <header class="topbar">
        <button class="menu-button" id="menuButton">☰</button>
        <div class="model-label">
          <span class="model-dot"></span>
          Gemini 3.8 Flash
        </div>
        <button class="clear-button" id="clearChat">Clear chat</button>
      </header>

      <section class="chat-area" id="chatArea">

        <div class="welcome" id="welcome">
          <div class="welcome-logo">Z</div>
          <div class="welcome-badge">✦ YOUR AI ASSISTANT</div>
          <h1>What can I help<br>you <span>with today?</span></h1>
          <p>Ask anything. Explore ideas. Create something amazing.</p>

          <div class="suggestions">
            <button class="suggestion" data-prompt="Give me 5 creative project ideas.">
              <span>✦</span>
              <div><strong>Creative ideas</strong><small>Discover something new</small></div>
            </button>

            <button class="suggestion" data-prompt="Teach me something interesting about technology.">
              <span>⌘</span>
              <div><strong>Learn something</strong><small>Explore new topics</small></div>
            </button>

            <button class="suggestion" data-prompt="Help me write a JavaScript program.">
              <span>⌨</span>
              <div><strong>Write code</strong><small>Build something cool</small></div>
            </button>

            <button class="suggestion" data-prompt="Help me plan a productive day.">
              <span>◷</span>
              <div><strong>Make a plan</strong><small>Organize your ideas</small></div>
            </button>
          </div>
        </div>

        <div class="messages" id="messages"></div>

      </section>

      <footer class="composer-area">
        <form class="composer" id="chatForm">
          <textarea
            id="messageInput"
            placeholder="Message Zentro..."
            rows="1"
            maxlength="10000"
          ></textarea>
          <button type="submit" id="sendButton" aria-label="Send message">
            ↑
          </button>
        </form>
        <p class="disclaimer">
          ZentroAI can make mistakes. Check important information.
        </p>
      </footer>

    </main>
  </div>

  <div class="mobile-overlay" id="mobileOverlay"></div>

  <script src="script.js"></script>
</body>
</html>
