<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Zentro AI</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'><circle cx='16' cy='16' r='14' fill='%238b5cf6'/></svg>">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <div class="app">
    <aside class="sidebar" id="sidebar">
      <div class="sb-top">
        <div class="brand"><span class="logo">Z</span><span>Zentro AI</span></div>
        <button class="icon-btn" id="closeSidebar" aria-label="Close sidebar">✕</button>
      </div>
      <button class="new-chat" id="newChat">+ New chat</button>
      <div class="sb-scroll">
        <div class="section-label">Features</div>
        <nav id="features"></nav>
        <div class="section-label">History</div>
        <div id="history"></div>
      </div>
      <button class="nav-item" id="openSettings">⚙ Settings</button>
    </aside>
    <div class="scrim" id="scrim"></div>

    <main class="main">
      <header class="topbar">
        <button class="icon-btn" id="menuBtn" aria-label="Toggle sidebar">☰</button>
        <div class="title" id="chatTitle">New chat</div>
        <button class="icon-btn" id="themeBtn" aria-label="Toggle theme">◐</button>
      </header>
      <section class="messages" id="messages"></section>
      <footer class="composer-wrap">
        <div class="composer">
          <textarea id="input" rows="1" maxlength="8000" placeholder="Message Zentro AI..."></textarea>
          <button class="send" id="sendBtn" aria-label="Send message">➤</button>
        </div>
        <p class="disclaimer">Zentro AI can make mistakes. Verify important information.</p>
      </footer>
    </main>
  </div>

  <div class="modal" id="settingsModal" hidden>
    <div class="modal-card" role="dialog" aria-labelledby="settingsTitle">
      <div class="modal-head">
        <h2 id="settingsTitle">Settings</h2>
        <button class="icon-btn" id="closeSettings" aria-label="Close settings">✕</button>
      </div>
      <label>Appearance
        <select id="themeSelect">
          <option value="dark">Dark</option>
          <option value="light">Light</option>
          <option value="system">System</option>
        </select>
      </label>
      <label>Font size
        <select id="fontSelect">
          <option value="14px">Small</option>
          <option value="16px">Medium</option>
          <option value="18px">Large</option>
        </select>
      </label>
      <button class="danger" id="clearAll">Delete all chats</button>
    </div>
  </div>

  <script src="app.js"></script>
</body>
</html>
